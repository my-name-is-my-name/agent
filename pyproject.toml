[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mro-assessment-agent"
version = "0.1.0"
description = "Local, evidence-grounded MRO assessment workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
  "langsmith>=0.3,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["mro_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
